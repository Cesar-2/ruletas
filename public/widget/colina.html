<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rey de la colina · widget</title>
<link rel="icon" href="data:," />
<!--
  El widget del Rey de la colina, para OBS.  /widget/colina.html?clave=XXXX

  Enseña dos cosas, y manda la que esté pasando:

    - Mientras se pelea, EL COMBATE: los dos muñecos con su clase de Dofus, las
      barras de vida y el relato golpe a golpe. Es el mismo dibujo y el mismo
      relato que la página, de js/dofus-arte.js y css/combate.css. Antes esto no
      estaba y en la superposición salía el rey y el resultado, pero no la pelea.
    - El resto del tiempo, quién manda y cuánto lleva aguantando: la racha es lo
      que se persigue en este minijuego, así que va en grande. Debajo, quién está
      esperando turno.
-->
<link rel="stylesheet" href="/css/widget.css" />
<!-- El combate es el MISMO que el de la página, no una copia parecida. -->
<link rel="stylesheet" href="/css/combate.css" />
<style>
  .corona { font-size: 2.2rem; line-height: 1; }
  .rey-nombre { font-size: 2.2rem; font-weight: 800; line-height: 1.1; margin-top: .2rem; }
  .rey-clase { font-size: .95rem; color: #9fb3c8; margin-top: .15rem; }
  /* La racha es el marcador de este juego: la cifra más grande de todas. */
  .racha { margin-top: .6rem; font-size: 1.15rem; color: #fbbf24; font-weight: 700; }
  .racha b { font-size: 2rem; }
  .tumbado { margin-top: .5rem; font-size: .95rem; color: #fca5a5; }
  .tumbado[hidden] { display: none; }
  .cola { margin-top: .9rem; padding-top: .7rem; border-top: 1px solid rgba(255,255,255,0.12); }
  .cola .titulo { font-size: .8rem; color: #9fb3c8; text-transform: uppercase; letter-spacing: .04em; }
  .cola .lista { margin-top: .35rem; font-size: 1rem; line-height: 1.5; }
  .cola[hidden] { display: none; }
  .nadie { color: #9fb3c8; font-size: 1.05rem; }
  .record { margin-top: .6rem; font-size: .85rem; color: #9fb3c8; }
  .record[hidden] { display: none; }
</style>
</head>
<body>
  <div id="todo">
    <div class="panel" id="panel">
      <div class="corona">👑</div>
      <div class="rey-nombre" id="quien">—</div>
      <div class="rey-clase" id="clase"></div>
      <div class="racha" id="racha"></div>
      <div class="tumbado" id="tumbado" hidden></div>
      <div class="cola" id="cola" hidden>
        <div class="titulo">Esperando turno</div>
        <div class="lista" id="colaLista"></div>
      </div>
      <div class="record" id="record" hidden></div>
    </div>
    <!-- El combate. Mismo id que en la página para poder compartir el CSS, y lo
         monta dibujarDueloColina() de js/dofus-arte.js. -->
    <div class="cuadro" id="colinaCuadro" hidden></div>
  </div>
  <div id="espera" hidden>Widget conectado · esperando a que abras la colina</div>
  <div id="fallo" hidden></div>

  <script src="/js/eventos.js"></script>
  <script src="/js/dofus-arte.js"></script>
  <script src="/js/widget-base.js"></script>
  <script>
  (function () {
    'use strict';
    const q = Widget.caja;

    // dofus-arte.js lee estos dos para saber qué clase le toca a cada uno y con
    // qué arte dibujarla. En la página son las variables del panel; aquí se ponen
    // desde lo que manda el servidor. Van en globalThis y no con let porque este
    // script está dentro de una función y dofus-arte.js las busca por su nombre.
    globalThis.colina = { clases: {}, peleados: 0, rey: null, cola: [] };
    globalThis.batalla = { luchadores: [], arte: { clases: {}, escenario: '', escenarios: [] } };

    // Cuántos combates se habían peleado la última vez que se contó uno. Sirve de
    // nombre del combate: el servidor no manda un identificador, pero sí cuántos
    // van, y eso sube en cada pelea.
    let contados = -1;
    // Mientras se cuenta un combate no se repinta nada: repintar dejaría el
    // relato a medias. Es lo mismo que hace la página con peleandoColina.
    let contando = false;
    // Si es la primera vez que se mira. Importa: al abrir el widget puede haber
    // un combate ya peleado en el servidor, y contarlo sería repetir en pantalla
    // una pelea de hace cinco minutos.
    let primerVistazo = true;
    // Lo que se da por «se está peleando ahora». El combate se cuenta en unos
    // segundos, así que con cuatro sobra para pillar uno recién empezado.
    const RECIEN = 4000;

    // Cuenta un combate nuevo, si lo hay. Devuelve true si se ha puesto a contar.
    function contarSiToca(e) {
      const d = e.duelo;
      if (contando) return true;
      if (!d || !d.golpes || !d.golpes.length) { primerVistazo = false; return false; }
      if (e.peleados === contados) { primerVistazo = false; return false; }

      // Al abrir el widget solo se cuenta el combate si se está peleando AHORA.
      // Uno viejo se da por visto y se espera al siguiente: mejor perderse uno
      // que soltar en pantalla una pelea que ya pasó.
      //
      // Se mira con el reloj del SERVIDOR (él manda su hora), que el del PC que
      // corre OBS puede ir adelantado y daría por viejo un combate recién salido.
      const recien = e.combateDesde && (e.ahora - e.combateDesde) < RECIEN;
      if (primerVistazo && !recien) {
        contados = e.peleados;
        primerVistazo = false;
        return false;
      }
      primerVistazo = false;
      contados = e.peleados;
      contando = true;
      // El marcado lo monta el mismo código que en la página, y el relato también.
      dibujarDueloColina(d, false);
      q('panel').hidden = true;
      q('colinaCuadro').hidden = false;
      Promise.resolve(contarRonda({ duelos: [d] }, 0, [0], 'colinaCuadro'))
        .catch(() => {})
        .then(() => { contando = false; });
      return true;
    }

    Widget.arranca({
      ruta: 'colina',
      pinta(e) {
        // Lo primero: darle a dofus-arte.js lo que necesita para dibujar. Sin las
        // clases que reparte la colina, los muñecos saldrían con otra clase que en
        // la página, porque claseDe() se las inventa del nombre cuando no las tiene.
        globalThis.colina = {
          clases: e.clases || {},
          peleados: e.peleados || 0,
          rey: e.rey || null,
          cola: e.cola || []
        };
        globalThis.batalla = { luchadores: [], arte: e.arte || { clases: {} } };

        // Mientras se pelea, manda el combate: es lo que se está mirando.
        if (contarSiToca(e)) return true;
        q('colinaCuadro').hidden = true;

        const hayRey = Boolean(e.rey);
        const hayCola = Boolean(e.cola && e.cola.length);
        // Con la colina abierta se enseña aunque no haya nadie: es cuando hay
        // que decirle al chat qué escribir para retar.
        if (!e.abierta && !hayRey && !hayCola) { q('panel').hidden = true; return false; }
        q('panel').hidden = false;

        if (hayRey) {
          q('quien').textContent = e.rey.nombre;
          q('clase').textContent = e.rey.clase || '';
          // Una victoria no es «racha de 1»: es que acaba de subir.
          q('racha').innerHTML = e.rey.racha > 1
            ? '<b>' + e.rey.racha + '</b> seguidas'
            : 'acaba de subir';
        } else {
          q('quien').textContent = 'La colina está libre';
          q('clase').textContent = '';
          q('racha').textContent = e.palabra ? 'Escribe ' + e.palabra + ' para retar' : '';
        }

        // A quién acaba de tumbar, mientras se cuenta el último combate.
        const tumbado = q('tumbado');
        tumbado.hidden = !e.derrotado;
        if (e.derrotado) tumbado.textContent = 'ha tumbado a ' + e.derrotado;

        const cola = q('cola');
        cola.hidden = !hayCola;
        if (hayCola) {
          q('cola').querySelector('.titulo').textContent = 'Esperando turno';
          // Con mucha cola no caben todos: los primeros, que son los que van a
          // pelear, y se dice cuántos vienen detrás.
          const caben = e.cola.slice(0, 8).map((r) => r.nombre);
          const sobran = e.cola.length - caben.length;
          q('colaLista').textContent = caben.join(' · ') + (sobran > 0 ? ' · y ' + sobran + ' más' : '');
        }

        // El récord histórico, si alguien ha llegado más lejos que el de ahora.
        const record = q('record');
        const mejor = e.record || e.mejor;
        const vale = mejor && (!hayRey || mejor.racha > e.rey.racha);
        record.hidden = !vale;
        if (vale) record.textContent = 'Récord: ' + mejor.nombre + ', ' + mejor.racha + ' seguidas';

        return true;
      }
    });
  })();
  </script>
</body>
</html>
