<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carrera de balineras · widget</title>
<link rel="icon" href="data:," />
<!--
  El widget de la carrera, para OBS.  /widget/carrera.html?clave=XXXX

  El servidor manda la carrera entera tick a tick (cuánto lleva recorrido cada
  corredor en cada instante). Aquí solo se reproduce: no se decide nada, así que
  lo que se ve en el directo es exactamente lo que pasó.

  La pista es la MISMA que la de la página, de css/carrera.css y
  js/carrera-pista.js: los mismos bichos del pliego con sus poses (correr,
  tropezar, acelerar, ganar), el semáforo de salida, los puestos y el relato.

  Antes esto tenía su propia pista, con emojis deslizándose por un carril, y no se
  parecía en nada a la del panel. Es lo mismo que pasó con las dos ruletas y con
  el combate del rey de la colina: duplicar una animación acaba en dos animaciones
  que se van separando.
-->
<link rel="stylesheet" href="/css/widget.css" />
<!-- La pista es la MISMA que la de la página, no una copia parecida. -->
<link rel="stylesheet" href="/css/carrera.css" />
<style>
  /* Lo único propio del widget: cuánto ocupa la pista encima del directo. La
     página la mete en una tarjeta; aquí manda la pantalla. */
  #carreraPista { width: min(94vw, 1000px); }
  #carreraRelato { max-width: min(94vw, 1000px); }
</style>
</head>
<body>
  <div id="todo">
    <div class="panel" id="apuntados" hidden>
      <div class="cifra" id="apCuantos">0</div>
      <div class="rotulo" id="apRotulo">apuntados</div>
      <div class="quienes" id="apQuienes"></div>
      <div class="cuenta" id="apCuenta" hidden></div>
    </div>
    <!-- Mismos ids que en la página, que es lo que permite compartir la pista y
         su CSS. Los monta dibujarPista() y los anima animarCarrera(). -->
    <div class="pista parada" id="carreraPista" hidden></div>
    <div class="relato" id="carreraRelato" hidden></div>
  </div>
  <div id="espera" hidden>Widget conectado · esperando a que abras una carrera</div>
  <div id="fallo" hidden></div>

  <script src="/js/eventos.js"></script>
  <script src="/js/carrera-pista.js"></script>
  <script src="/js/widget-base.js"></script>
  <script>
  (function () {
    'use strict';
    const q = Widget.caja;

    // Cuánto se queda la foto final antes de quitarse: es donde se lee quién
    // ganó, y con menos no da tiempo.
    const QUIETA_AL_FINAL = 8000;
    // De qué carrera es lo que se está viendo, para reproducirla una sola vez.
    // El servidor manda cuándo se corrió, y eso es distinto en cada carrera.
    let vista = '';
    let quitarseEn = 0;

    // carrera-pista.js lee este estado: quién corre (con su clave), las marcas
    // tick a tick y cuánto dura. En la página es la variable del panel; aquí se
    // pone desde lo que manda el servidor. Va en globalThis porque este script
    // está dentro de una función y el módulo lo busca por su nombre.
    function ponerEstado(e) {
      globalThis.carrera = {
        abierta: Boolean(e.abierta),
        corredores: e.corredores || [],
        resultado: e.resultado || [],
        corridaEn: e.corridaEn || '',
        marcas: e.marcas || [],
        eventos: e.eventos || [],
        ajustes: { duracion: e.duracion || 8, animacion: e.animacion || 'caballos' }
      };
    }

    Widget.arranca({
      ruta: 'carrera',
      pinta(e) {
        ponerEstado(e);
        const hayCarrera = e.marcas && e.marcas.length && e.corridaEn;

        // Una carrera nueva se reproduce una sola vez, y con el mismo código que
        // la página: se dibuja la pista y se anima.
        if (hayCarrera && e.corridaEn !== vista) {
          vista = e.corridaEn;
          q('apuntados').hidden = true;
          q('carreraPista').hidden = false;
          dibujarPista();
          animarCarrera(e.resultado || []);
          // Lo que dura la carrera más lo que se queda la foto final. La cuenta
          // atrás del semáforo la pone el módulo, así que se le suma.
          quitarseEn = Date.now() + 2400 + (Number(e.duracion) || 8) * 1000 + QUIETA_AL_FINAL;
          return true;
        }
        // Mientras se está viendo, no se toca nada: repintar dejaría la carrera a
        // medias.
        if (quitarseEn && Date.now() < quitarseEn) return true;
        if (quitarseEn) {
          quitarseEn = 0;
          q('carreraPista').hidden = true;
          q('carreraRelato').hidden = true;
        }

        // Con la inscripción abierta se enseña, aunque no haya nadie todavía: es
        // entonces cuando hay que decirle al chat qué escribir.
        const apuntados = q('apuntados');
        apuntados.hidden = !e.abierta;
        if (e.abierta) {
          q('carreraPista').hidden = true;
          q('carreraRelato').hidden = true;
          Widget.pintarApuntados(
            { cuantos: 'apCuantos', rotulo: 'apRotulo', quienes: 'apQuienes', cuenta: 'apCuenta' },
            (e.corredores || []).map((c) => c.nombre),
            e.palabra, e.cierraEn
          );
        }
        return Boolean(e.abierta);
      }
    });
  })();
  </script>
</body>
</html>
