<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ruleta de recursos · widget</title>
<link rel="icon" href="data:," />
<!--
  El widget de la ruleta de siempre, la de recursos.  /widget/sorteo.html?clave=XXXX

  Recursos y no «objetos»: en este proyecto no es lo mismo. Lo que se sortea es la
  familia 'resources' del catalogo; los equipables (los «objetos») son otro
  catalogo aparte que no entra en el sorteo, solo se consulta.

  Aquí decide el servidor: el sorteo lo hace /api/random-items con sus rarezas y
  sus exclusiones, y esto solo enseña lo que salió. Antes se sorteaba y se
  acababa sin dejar rastro, así que la superposición no tenía nada que contar.

  Mientras gira se ve la tragaperras dando vueltas con recursos del catálogo, y al
  parar salen los premios y a quién le tocan.

  Los rodillos dan vueltas con RELLENO (otros recursos del mismo catálogo, que el
  servidor manda aparte) y cada uno para sobre SU premio, como en la página.

  Eso obliga a mandar los premios desde el principio: un rodillo que para sobre
  relleno estaría enseñando un objeto que nadie ha ganado, y eso engaña más de lo
  que protege. Así que con esta dirección se puede saber lo que va a salir durante
  los segundos de la animación. Lo que sí se sigue callando es a quién le toca.
-->
<link rel="stylesheet" href="/css/widget.css" />
<!-- La tragaperras es la MISMA que la de la página, no una copia parecida. -->
<link rel="stylesheet" href="/css/tragaperras.css" />
<style>
  .premios {
    display: flex;
    flex-wrap: wrap;
    gap: .7rem;
    justify-content: center;
    max-width: 46rem;
  }
  .premio {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .35rem;
    width: 8.6rem;
    padding: .6rem .4rem;
    border-radius: 12px;
    background: rgba(9, 15, 28, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.18);
  }
  /* Los mismos colores de rareza que la página, para que el premio se vea igual
     en el panel y en la superposición. */
  .premio.common { border-color: #a8b8cc }
  .premio.rare   { border-color: #3b82f6 }
  .premio.epic   { border-color: #a855f7 }
  .premio.mythic { border-color: #ef4444 }
  .premio img { width: 4.4rem; height: 4.4rem; object-fit: contain }
  .premio .nombre { font-size: .85rem; text-align: center; line-height: 1.2 }

  .girando-texto { margin-top: .6rem; text-align: center; font-size: 1.1rem; opacity: .85 }
</style>
</head>
<body>
  <div id="todo">
    <div class="panel" id="panelGira" hidden>
      <div class="tragaperras" id="rodillos"></div>
      <div class="girando-texto">Sorteando…</div>
    </div>
    <div class="panel" id="panelPremio" hidden>
      <div class="cifra" id="quien"></div>
      <div class="rotulo" id="rotulo"></div>
      <div class="premios" id="premios"></div>
    </div>
  </div>
  <div id="espera" hidden>Widget conectado · esperando a que sortees</div>
  <div id="fallo" hidden></div>

  <script src="/js/eventos.js"></script>
  <script src="/js/tragaperras.js"></script>
  <script src="/js/widget-base.js"></script>
  <script>
  (function () {
    'use strict';
    const q = Widget.caja;

    // De qué sorteo es la tragaperras que está puesta, para no volver a montarla
    // en cada aviso. «cuando» es distinto en cada sorteo, así que sirve de nombre.
    let giraDe = '';
    let mando = null;

    function pararRodillos() {
      if (mando) { mando.quitar(); mando = null; }
      giraDe = '';
    }

    // La monta Tragaperras, que es el mismo código que usa la página: un rodillo
    // por recurso, todos cambiando cada 190 ms y parando de izquierda a derecha.
    // Ver js/tragaperras.js.
    function montarRodillos(s, restanteMs) {
      pararRodillos();
      mando = Tragaperras.montar({
        caja: q('rodillos'),
        cuantos: s.cuantos || 1,
        relleno: s.relleno || [],
        premios: s.cosas || [],
        // Un cuarto de segundo de margen: así el último rodillo se ve aterrizar
        // antes de que la tragaperras se cambie por las tarjetas del premio.
        espera: restanteMs - 250
      });
      return Boolean(mando);
    }

    function pintarPremios(s) {
      const caja = q('premios');
      caja.innerHTML = '';
      for (const c of s.cosas || []) {
        const d = document.createElement('div');
        d.className = 'premio ' + (c.rareza || 'common');
        if (c.imagen) {
          const img = document.createElement('img');
          img.src = c.imagen;
          img.alt = '';
          d.appendChild(img);
        }
        const n = document.createElement('div');
        n.className = 'nombre';
        n.textContent = c.nombre;
        d.appendChild(n);
        caja.appendChild(d);
      }
    }

    Widget.arranca({
      ruta: 'sorteo',
      pinta(e) {
        const s = e.sorteo;
        if (!s) {
          pararRodillos();
          q('panelGira').hidden = true;
          q('panelPremio').hidden = true;
          return false;
        }

        if (s.girando) {
          q('panelPremio').hidden = true;
          // Lo que le queda para parar, con el reloj DEL SERVIDOR: el del PC que
          // corre OBS puede ir adelantado, y con su hora las paradas caerían mal.
          const restante = s.terminaEn - e.ahora;
          if (giraDe !== s.cuando) {
            if (montarRodillos(s, restante)) giraDe = s.cuando;
          }
          q('panelGira').hidden = false;
          return true;
        }

        // Ha parado: fuera la tragaperras y salen las tarjetas, igual que en la
        // página.
        pararRodillos();
        q('panelGira').hidden = true;
        if (!s.cosas || !s.cosas.length) { q('panelPremio').hidden = true; return false; }

        // Sin nombre escrito se anuncia el sorteo sin dueño, que es lo que hace
        // la página: «3 recurso(s) sorteado(s)».
        q('quien').textContent = s.quien || (s.cosas.length + (s.cosas.length === 1 ? ' recurso' : ' recursos'));
        q('rotulo').textContent = s.quien
          ? (s.cosas.length === 1 ? 'se lleva' : 'se lleva ' + s.cosas.length)
          : 'sorteados';
        pintarPremios(s);
        q('panelPremio').hidden = false;
        return true;
      }
    });
  })();
  </script>
</body>
</html>
