<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ruleta de nombres · widget</title>
<link rel="icon" href="data:," />
<!--
  El widget de la Ruleta de nombres, para OBS.  /widget/nombres.html?clave=XXXX

  Enseña dos cosas: la inscripción (quién se va apuntando desde el chat y cuánto
  queda para cerrar) y el resultado del último giro.

  Conviene saber de dónde sale ese resultado: a esta ruleta la gira la PÁGINA, no
  el servidor, porque la lista de nombres vive en su cuadro de texto y el
  servidor no conoce a los participantes. Así que la página le cuenta al servidor
  lo que ha salido, y esto lo repite. Es un espejo, no un árbitro; en los otros
  minijuegos es al contrario, decide el servidor y el navegador solo lo anima.

  El servidor no suelta quién ha salido hasta que la ruleta ha parado, así que
  tener la dirección de este widget no destripa el resultado antes de verse.

  Los dos modos de la ruleta no son simétricos: normalmente el de la banda gana,
  pero eliminando el de la banda SE VA y gana quien aguanta hasta quedarse solo.
  Por eso el cartel mira `seVa` y `ganador` por separado en vez de dar por hecho
  que el de la banda ha ganado.
-->
<link rel="stylesheet" href="/css/widget.css" />
<!-- La cinta es la MISMA que la de la página, no una copia parecida. -->
<link rel="stylesheet" href="/css/ruleta-nombres.css" />
<style>
  .lista-nombres {
    margin-top: .8rem;
    display: flex;
    flex-wrap: wrap;
    gap: .35rem;
    justify-content: center;
    max-width: 44rem;
  }
  .lista-nombres span {
    padding: .25rem .6rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-size: .95rem;
  }
  /* Los últimos en llegar se destacan: es lo que la gente busca al apuntarse. */
  .lista-nombres span.nuevo { border-color: rgba(110, 231, 183, .5); color: #6ee7b7; }

  /* El cartel del resultado. Va en grande porque es lo que se queda en pantalla
     cuando la ruleta para: es el momento que la gente mira. */
  .resultado { text-align: center; }
  .resultado .quien {
    font-size: 2.6rem;
    font-weight: 800;
    line-height: 1.1;
    word-break: break-word;
  }
  .resultado .que { margin-top: .3rem; font-size: 1rem; opacity: .85 }
  .resultado.gana .quien { color: #6ee7b7 }
  .resultado.fuera .quien { color: #fca5a5; text-decoration: line-through }
  /* El premio que queda tras doblar. */
  .resultado .premio { margin-top: .35rem; font-size: 1.5rem; font-weight: 800; color: #6ee7b7 }
  .resultado.fuera .premio { color: #fca5a5 }

  /* El vídeo del doble o nada tapa el widget ENTERO, igual que en la página tapa
     la escena: cuando suena, es lo único que hay que mirar. */
  .escena-video {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: #04121c;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .escena-video[hidden] { display: none }
  .escena-video video { width: 100%; height: 100%; object-fit: contain; display: block }
  /* El cartel del resultado. Va en grande porque es lo que se queda en pantalla
     cuando la ruleta para: es el momento que la gente mira. */
  .resultado { text-align: center; }
  .resultado .quien {
    font-size: 2.6rem;
    font-weight: 800;
    line-height: 1.1;
    word-break: break-word;
  }
  .resultado .que { margin-top: .3rem; font-size: 1rem; opacity: .85 }
  .resultado.gana .quien { color: #6ee7b7 }
  .resultado.fuera .quien { color: #fca5a5; text-decoration: line-through }
  /* El premio que queda tras doblar. */
  .resultado .premio { margin-top: .35rem; font-size: 1.5rem; font-weight: 800; color: #6ee7b7 }
  .resultado.fuera .premio { color: #fca5a5 }

  /* El vídeo del doble o nada tapa el widget ENTERO, igual que en la página tapa
     la escena: cuando suena, es lo único que hay que mirar. */
  .escena-video {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: #04121c;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .escena-video[hidden] { display: none }
  .escena-video video { width: 100%; height: 100%; object-fit: contain; display: block }
</style>
</head>
<body>
  <div id="todo">
    <div class="panel" id="panel" hidden>
      <div class="cifra" id="cuantos">0</div>
      <div class="rotulo" id="rotulo">apuntados a la ruleta</div>
      <div class="lista-nombres" id="lista"></div>
      <div class="cuenta" id="cuenta" hidden></div>
    </div>
    <div class="panel" id="panelGira" hidden>
      <!-- El mismo marcado que en la página: la caja recorta, la tira se mueve,
           la marca es la banda del centro y el velo difumina arriba y abajo. -->
      <div class="names-reel-box" style="width:34rem">
        <div class="names-reel" id="cintaCaja" role="img" aria-label="Rodillo de nombres">
          <div class="tira" id="cinta"></div>
          <div class="marca"></div>
          <div class="velo"></div>
        </div>
      </div>
    </div>
    <div class="panel" id="panelResultado" hidden>
      <div class="resultado" id="resultado">
        <div class="quien" id="resQuien"></div>
        <div class="que" id="resQue"></div>
        <div class="premio" id="resPremio" hidden></div>
      </div>
    </div>
  </div>
  <!-- El mismo marcado que en la página, para poder usar el mismo código. -->
  <div class="escena-video" id="nameVideo" hidden>
    <video id="nameVideoPlayer" playsinline preload="auto" muted></video>
  </div>
  <div id="espera" hidden>Widget conectado · esperando a que abras la ruleta</div>
  <div id="fallo" hidden></div>

  <script src="/js/eventos.js"></script>
  <script src="/js/ruleta-nombres.js"></script>
  <script src="/js/widget-base.js"></script>
  <script>
  (function () {
    'use strict';
    const q = Widget.caja;
    // Cuántos de los últimos se marcan como recién llegados.
    const RECIENTES = 3;

    // De qué giro es la cinta que está puesta, para no volver a lanzarla en cada
    // aviso. El servidor manda «cuando», distinto en cada giro, así que sirve de
    // nombre.
    let cintaDe = '';

    // Lanza la cinta. Se le pasa lo que le QUEDA para parar, no lo que duraba el
    // giro: si el widget se entera tarde (el aviso tarda, o se acaba de abrir a
    // mitad de giro), el giro es más corto pero para en el mismo instante y en el
    // mismo nombre que la página.
    //
    // El cómo lo hace es de CintaNombres, que es el mismo código que usa la
    // página: así no hay dos cintas que se parezcan cada vez menos.
    // Qué fila ha quedado en la banda, para poder encenderla al parar.
    let cintaFila = -1;

    // De qué doble o nada es el vídeo que está puesto, para no volver a lanzarlo
    // en cada aviso que llegue mientras suena.
    let dobleDe = '';

    // Enseña el mismo vídeo que la página. El archivo es el mismo, así que dura
    // lo mismo y los dos acaban a la vez sin cuadrar relojes.
    //
    // Va MUTED a propósito: el sonido lo pone la página, que es la que está en el
    // PC del dueño. Dos copias sonando a la vez se oiría como un eco. Y de paso,
    // un vídeo con sonido no arranca solo en un navegador; muted sí.
    function lanzarDoble(d) {
      dobleDe = d.cuando;
      CintaNombres.animacion(
        q('nameVideo'),
        q('nameVideoPlayer'),
        d.gana ? 'ganar' : 'perder'
      );
    }

    function lanzarCinta(s, restanteMs) {
      cintaFila = CintaNombres.girar({
        // El panel va aquí a propósito: la cinta tiene que estar A LA VISTA antes
        // de medirla. Oculta mide 0 de alto, y con 0 la parada sale 0 y no se
        // mueve nada. Era justo lo que pasaba.
        panel: q('panelGira'),
        caja: q('cintaCaja'),
        tira: q('cinta'),
        lista: s.nombres || [],
        elegido: s.elegido || 0,
        ms: restanteMs
      });
      return cintaFila >= 0;
    }

    Widget.arranca({
      ruta: 'nombres',
      pinta(e) {
        const s = e.sorteo;
        const d = e.doble;

        // El doble o nada manda sobre todo lo demás: mientras suena, tapa.
        if (d && dobleDe !== d.cuando) lanzarDoble(d);
        if (!d) { dobleDe = ''; q('nameVideo').hidden = true; }

        // Mientras gira, y después con el cartel puesto, manda el resultado: es
        // lo que se está mirando. La inscripción se aparta para no competir con
        // el cartel, aunque siga abierta (eliminando se sigue girando con la
        // inscripción abierta).
        q('panelResultado').hidden = !(s && !s.girando && s.quien);

        if (s && s.girando) {
          q('panel').hidden = true;
          // Lo que le queda para parar, con el reloj DEL SERVIDOR: el del PC que
          // corre OBS puede ir adelantado o atrasado, y con su hora la cinta
          // pararía antes o después que la página.
          const restante = s.terminaEn - e.ahora;
          if (cintaDe !== s.cuando) {
            if (lanzarCinta(s, restante)) cintaDe = s.cuando;
          }
          q('panelGira').hidden = false;
          return true;
        }
        if (s && s.quien) {
          q('panel').hidden = true;
          // La cinta se QUEDA, con el que ha parado encendido: es lo que hace la
          // página, y quitarla justo al parar es perderse el momento. El cartel
          // sale debajo.
          if (cintaDe === s.cuando && cintaFila >= 0) {
            CintaNombres.marcar(q('cinta'), cintaFila, s.seVa);
          } else {
            q('panelGira').hidden = true;
          }
          const caja = q('resultado');
          // Eliminando, el de la banda se va. Y si con eso queda uno, ese gana:
          // el cartel lo dice con su nombre, no con el del que se acaba de ir.
          if (s.seVa) {
            if (s.ganador) {
              caja.className = 'resultado gana';
              q('resQuien').textContent = s.ganador;
              q('resQue').textContent = '¡gana la ruleta!';
            } else {
              caja.className = 'resultado fuera';
              q('resQuien').textContent = s.quien;
              q('resQue').textContent = s.quedan === 1
                ? 'queda fuera · queda 1'
                : 'queda fuera · quedan ' + s.quedan;
            }
          } else {
            caja.className = 'resultado gana';
            q('resQuien').textContent = s.ganador || s.quien;
            q('resQue').textContent = s.cuantos > 1
              ? '¡gana la ruleta! · entre ' + s.cuantos
              : '¡gana la ruleta!';
          }

          // Y si se ha jugado el doble o nada, lo que le queda. Se dice igual que
          // en la página: «Premio x4», o que se queda sin nada.
          const premio = q('resPremio');
          if (d && d.quien === (s.ganador || s.quien)) {
            premio.hidden = false;
            premio.textContent = d.gana ? 'Premio x' + d.premio : 'Se queda sin nada';
            if (!d.gana) caja.className = 'resultado fuera';
          } else {
            premio.hidden = true;
          }
          return true;
        }

        // Sin nada del giro que enseñar, fuera la cinta.
        q('panelGira').hidden = true;
        cintaDe = '';
        cintaFila = -1;

        // Abierta se enseña aunque no haya nadie: es cuando hay que decir qué
        // escribir en el chat.
        q('panel').hidden = !e.abierta;
        if (!e.abierta) return false;
        const quienes = e.nombres || [];

        q('cuantos').textContent = quienes.length;
        q('rotulo').textContent = quienes.length === 1
          ? 'apuntado a la ruleta'
          : 'apuntados a la ruleta';

        const lista = q('lista');
        lista.innerHTML = '';
        if (!quienes.length) {
          // Sin nadie, lo útil es qué hay que escribir, no una lista vacía.
          const invita = document.createElement('span');
          invita.textContent = e.palabra ? 'Escribe ' + e.palabra + ' en el chat' : 'Escribe en el chat para entrar';
          lista.appendChild(invita);
        } else {
          // Con mucha gente no caben todos: los últimos, que son los que acaban
          // de escribir, y se dice cuántos vienen detrás.
          const caben = quienes.slice(-24);
          const sobran = quienes.length - caben.length;
          caben.forEach((nombre, i) => {
            const s = document.createElement('span');
            s.textContent = nombre;
            if (i >= caben.length - RECIENTES) s.className = 'nuevo';
            lista.appendChild(s);
          });
          if (sobran > 0) {
            const mas = document.createElement('span');
            mas.textContent = 'y ' + sobran + ' más';
            lista.appendChild(mas);
          }
        }

        const cuenta = q('cuenta');
        const quedan = e.cierraEn ? Math.max(0, Math.round((e.cierraEn - Date.now()) / 1000)) : 0;
        cuenta.hidden = !quedan;
        if (quedan) cuenta.textContent = 'cierra en ' + quedan + 's';
        return true;
      }
    });
  })();
  </script>
</body>
</html>
