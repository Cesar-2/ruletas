<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ruleta de nombres · widget</title>
<link rel="icon" href="data:," />
<!--
  El widget de la Ruleta de nombres, para OBS.  /widget/nombres.html?clave=XXXX

  Enseña dos cosas: la inscripción (quién se va apuntando desde el chat y cuánto
  queda para cerrar) y el resultado del último giro.

  Conviene saber de dónde sale ese resultado: a esta ruleta la gira la PÁGINA, no
  el servidor, porque la lista de nombres vive en su cuadro de texto y el
  servidor no conoce a los participantes. Así que la página le cuenta al servidor
  lo que ha salido, y esto lo repite. Es un espejo, no un árbitro; en los otros
  minijuegos es al contrario, decide el servidor y el navegador solo lo anima.

  El servidor no suelta quién ha salido hasta que la ruleta ha parado, así que
  tener la dirección de este widget no destripa el resultado antes de verse.

  Los dos modos de la ruleta no son simétricos: normalmente el de la banda gana,
  pero eliminando el de la banda SE VA y gana quien aguanta hasta quedarse solo.
  Por eso el cartel mira `seVa` y `ganador` por separado en vez de dar por hecho
  que el de la banda ha ganado.
-->
<link rel="stylesheet" href="/css/widget.css" />
<style>
  .lista-nombres {
    margin-top: .8rem;
    display: flex;
    flex-wrap: wrap;
    gap: .35rem;
    justify-content: center;
    max-width: 44rem;
  }
  .lista-nombres span {
    padding: .25rem .6rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-size: .95rem;
  }
  /* Los últimos en llegar se destacan: es lo que la gente busca al apuntarse. */
  .lista-nombres span.nuevo { border-color: rgba(110, 231, 183, .5); color: #6ee7b7; }

  /* El cartel del resultado. Va en grande porque es lo que se queda en pantalla
     cuando la ruleta para: es el momento que la gente mira. */
  .resultado { text-align: center; }
  .resultado .quien {
    font-size: 2.6rem;
    font-weight: 800;
    line-height: 1.1;
    word-break: break-word;
  }
  .resultado .que { margin-top: .3rem; font-size: 1rem; opacity: .85 }
  .resultado.gana .quien { color: #6ee7b7 }
  .resultado.fuera .quien { color: #fca5a5; text-decoration: line-through }
  /* La cinta, igual que en la página: los nombres desfilan hacia arriba y el
     que gana para en la banda del centro. La misma curva y el mismo alto de
     fila, para que el widget y la página paren juntos y en el mismo sitio. */
  .cinta-caja {
    position: relative;
    height: 13.8rem;          /* tres filas de 4.6rem */
    overflow: hidden;
    border-radius: 12px;
    background: rgba(9, 15, 28, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.14);
  }
  .cinta { will-change: transform }
  .cinta .fila {
    height: 4.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    font-weight: 700;
    padding: 0 .8rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* La banda del centro: es la que dice donde para. */
  .banda {
    position: absolute;
    left: 0; right: 0;
    top: 4.6rem;
    height: 4.6rem;
    pointer-events: none;
    border-top: 2px solid rgba(110, 231, 183, .75);
    border-bottom: 2px solid rgba(110, 231, 183, .75);
    background: rgba(110, 231, 183, .08);
  }
</style>
</head>
<body>
  <div id="todo">
    <div class="panel" id="panel" hidden>
      <div class="cifra" id="cuantos">0</div>
      <div class="rotulo" id="rotulo">apuntados a la ruleta</div>
      <div class="lista-nombres" id="lista"></div>
      <div class="cuenta" id="cuenta" hidden></div>
    </div>
    <div class="panel" id="panelGira" hidden>
      <div class="cinta-caja">
        <div class="cinta" id="cinta"></div>
        <div class="banda"></div>
      </div>
    </div>
    <div class="panel" id="panelResultado" hidden>
      <div class="resultado" id="resultado">
        <div class="quien" id="resQuien"></div>
        <div class="que" id="resQue"></div>
      </div>
    </div>
  </div>
  <div id="espera" hidden>Widget conectado · esperando a que abras la ruleta</div>
  <div id="fallo" hidden></div>

  <script src="/js/eventos.js"></script>
  <script src="/js/widget-base.js"></script>
  <script>
  (function () {
    'use strict';
    const q = Widget.caja;
    // Cuántos de los últimos se marcan como recién llegados.
    const RECIENTES = 3;

    // La misma curva que la página, para que la cinta frene igual.
    const CURVA = 'cubic-bezier(.12,.72,.18,1)';
    // Tres filas a la vista y la banda en la de en medio: la que para ahí es la
    // que ha salido. Cuadra con el CSS de arriba.
    const VISIBLES = 3;

    // De qué giro es la cinta que está puesta ahora, para no volver a lanzarla
    // en cada aviso que llegue. El servidor manda «cuando», que es distinto en
    // cada giro y por tanto sirve de nombre.
    let cintaDe = '';

    function escapa(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    // Lanza la cinta. Se le dice cuánto le queda para parar, no cuánto duraba: si
    // el widget se entera tarde (el aviso tarda un poco, o se acaba de abrir a
    // mitad de giro), el giro es más corto pero PARA en el mismo instante y en el
    // mismo nombre que la página. Que pare a la vez importa más que que dure lo
    // mismo.
    function lanzarCinta(s, restanteMs) {
      const lista = s.nombres || [];
      if (!lista.length) return false;
      const cinta = q('cinta');

      // Las vueltas se ajustan al tamaño de la lista, igual que en la página: con
      // cuatro nombres un giro de cuatro filas no se vería, y con doscientos no
      // hacen falta miles de filas.
      const vueltas = Math.max(3, Math.min(12, Math.ceil(80 / lista.length)));
      // Y detrás del ganador va una cola, que si no, cuando el que para es el
      // último de la lista, queda media caja vacía debajo.
      const cola = [];
      for (let i = 0; i < VISIBLES + 1; i++) cola.push(lista[i % lista.length]);

      const filas = [];
      for (let v = 0; v < vueltas; v++) filas.push.apply(filas, lista);
      filas.push.apply(filas, cola);
      cinta.innerHTML = filas.map((n) => '<div class="fila">' + escapa(n) + '</div>').join('');

      // El alto se mide, no se supone: lo pone el CSS en rem y cambia con el
      // tamaño de la fuente. Calculándolo aquí, la cinta pararía entre dos
      // nombres en cuanto el widget se escalara en OBS.
      const primera = cinta.querySelector('.fila');
      const alto = primera ? primera.getBoundingClientRect().height : 73.6;
      const cual = (vueltas - 1) * lista.length + Math.min(s.elegido || 0, lista.length - 1);
      const parada = -cual * alto + alto * (VISIBLES - 1) / 2;

      // Se arranca desde arriba sin transición y se fuerza el recálculo: si no,
      // el navegador junta las dos posiciones en una y no se ve girar nada.
      cinta.style.transition = 'none';
      cinta.style.transform = 'translateY(0px)';
      void cinta.offsetHeight;
      cinta.style.transition = 'transform ' + Math.max(200, restanteMs) + 'ms ' + CURVA;
      cinta.style.transform = 'translateY(' + parada + 'px)';
      return true;
    }

    Widget.arranca({
      ruta: 'nombres',
      pinta(e) {
        const s = e.sorteo;

        // Mientras gira, y después con el cartel puesto, manda el resultado: es
        // lo que se está mirando. La inscripción se aparta para no competir con
        // el cartel, aunque siga abierta (eliminando se sigue girando con la
        // inscripción abierta).
        q('panelResultado').hidden = !(s && !s.girando && s.quien);

        if (s && s.girando) {
          q('panel').hidden = true;
          // Lo que le queda para parar, con el reloj DEL SERVIDOR: el del PC que
          // corre OBS puede ir adelantado o atrasado, y con su hora la cinta
          // pararía antes o después que la página.
          const restante = s.terminaEn - e.ahora;
          if (cintaDe !== s.cuando) {
            if (lanzarCinta(s, restante)) cintaDe = s.cuando;
          }
          q('panelGira').hidden = false;
          return true;
        }
        q('panelGira').hidden = true;

        if (s && s.quien) {
          q('panel').hidden = true;
          const caja = q('resultado');
          // Eliminando, el de la banda se va. Y si con eso queda uno, ese gana:
          // el cartel lo dice con su nombre, no con el del que se acaba de ir.
          if (s.seVa) {
            if (s.ganador) {
              caja.className = 'resultado gana';
              q('resQuien').textContent = s.ganador;
              q('resQue').textContent = '¡gana la ruleta!';
            } else {
              caja.className = 'resultado fuera';
              q('resQuien').textContent = s.quien;
              q('resQue').textContent = s.quedan === 1
                ? 'queda fuera · queda 1'
                : 'queda fuera · quedan ' + s.quedan;
            }
          } else {
            caja.className = 'resultado gana';
            q('resQuien').textContent = s.ganador || s.quien;
            q('resQue').textContent = s.cuantos > 1
              ? '¡gana la ruleta! · entre ' + s.cuantos
              : '¡gana la ruleta!';
          }
          return true;
        }

        // Abierta se enseña aunque no haya nadie: es cuando hay que decir qué
        // escribir en el chat.
        q('panel').hidden = !e.abierta;
        if (!e.abierta) return false;
        const quienes = e.nombres || [];

        q('cuantos').textContent = quienes.length;
        q('rotulo').textContent = quienes.length === 1
          ? 'apuntado a la ruleta'
          : 'apuntados a la ruleta';

        const lista = q('lista');
        lista.innerHTML = '';
        if (!quienes.length) {
          // Sin nadie, lo útil es qué hay que escribir, no una lista vacía.
          const invita = document.createElement('span');
          invita.textContent = e.palabra ? 'Escribe ' + e.palabra + ' en el chat' : 'Escribe en el chat para entrar';
          lista.appendChild(invita);
        } else {
          // Con mucha gente no caben todos: los últimos, que son los que acaban
          // de escribir, y se dice cuántos vienen detrás.
          const caben = quienes.slice(-24);
          const sobran = quienes.length - caben.length;
          caben.forEach((nombre, i) => {
            const s = document.createElement('span');
            s.textContent = nombre;
            if (i >= caben.length - RECIENTES) s.className = 'nuevo';
            lista.appendChild(s);
          });
          if (sobran > 0) {
            const mas = document.createElement('span');
            mas.textContent = 'y ' + sobran + ' más';
            lista.appendChild(mas);
          }
        }

        const cuenta = q('cuenta');
        const quedan = e.cierraEn ? Math.max(0, Math.round((e.cierraEn - Date.now()) / 1000)) : 0;
        cuenta.hidden = !quedan;
        if (quedan) cuenta.textContent = 'cierra en ' + quedan + 's';
        return true;
      }
    });
  })();
  </script>
</body>
</html>
