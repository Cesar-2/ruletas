<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mi cartón · Bingo</title>
<link rel="icon" href="data:," />
<!--
  El cartón del bingo, para el espectador.  /bingo?p=CODIGO

  No hay cuenta ni sesión: el código de la partida sale en el directo y el
  nombre es el de Twitch. Esto solo sirve para MIRAR el cartón; para cantar hay
  que escribir en el chat, que es lo único que demuestra quién eres. Ver
  src/bingo.ts.

  Lo marcado lo marca el servidor con las bolas que han salido. Lo que el
  espectador tiene que hacer es darse cuenta a tiempo de que ha hecho línea o
  bingo, y cantarlo.
-->
<link rel="stylesheet" href="/css/bingo.css" />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0, #13284a, #071022 70%);
    color: #e6eef8;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 1.2rem 1rem 3rem;
    box-sizing: border-box;
  }
  main { width: 100%; max-width: 26rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  h1 { margin: 0; font-size: 1.6rem; }
  .juego { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  form { display: flex; flex-direction: column; gap: .6rem; width: 100%; }
  form[hidden] { display: none; }
  label { font-size: .9rem; color: #9fb3c8; }
  input {
    font-size: 1.1rem;
    padding: .7rem .8rem;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .15);
    background: #0b1220;
    color: inherit;
  }
  button {
    font-size: 1.05rem;
    font-weight: 700;
    padding: .75rem 1rem;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #6ee7b7, #3ee9c0);
    color: #021018;
    cursor: pointer;
  }
  button.suave { background: none; color: #6ee7b7; text-decoration: underline; padding: .2rem; font-size: .9rem; }
  .aviso { text-align: center; color: #9fb3c8; }
  .aviso b { color: #6ee7b7; }
  .aviso.malo { color: #fca5a5; }
  .quien { font-size: 1.2rem; font-weight: 800; }
  .arriba { display: flex; align-items: center; gap: 1rem; }
  .arriba .bingo-bola { width: 5rem; height: 5rem; }
  .arriba .bingo-bola .numero { font-size: 2.1rem; }
  .arriba .bingo-bola .letra { font-size: 1rem; }
  .cantar {
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    padding: .9rem;
    border-radius: 12px;
    background: rgba(110, 231, 183, .14);
    border: 2px solid #6ee7b7;
    font-size: 1.15rem;
    font-weight: 800;
  }
  .cantar[hidden] { display: none; }
  .ganadores { list-style: none; padding: 0; margin: 0; text-align: center; color: #6ee7b7; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>🎱 Mi cartón</h1>

  <form id="entrar">
    <label for="codigo">Código de la partida (sale en el directo)</label>
    <input id="codigo" autocomplete="off" autocapitalize="characters" maxlength="10" required />
    <label for="nombre">Tu nombre de Twitch</label>
    <input id="nombre" autocomplete="username" maxlength="40" required />
    <button type="submit">Ver mi cartón</button>
  </form>

  <p class="aviso" id="aviso" hidden></p>

  <section id="juego" class="juego" hidden>
      <div class="quien" id="quien"></div>
      <div class="arriba">
        <div class="bingo-bola vacia" id="bola"><span class="numero">?</span></div>
        <div class="aviso" id="fase"></div>
      </div>
      <div class="cantar" id="cantar" hidden></div>
      <div id="carton"></div>
      <ul class="ganadores" id="ganadores"></ul>
      <button type="button" class="suave" id="cambiar">Ver otro cartón</button>
  </section>
</main>

<script src="/js/bingo-dibujo.js"></script>
<script>
(function () {
  'use strict';

  // Cada cuánto se pregunta. Esta página la abren los espectadores, que
  // pueden ser muchos; tres segundos van de sobra para ver una bola que el
  // streamer saca a mano.
  const CADA_MS = 3000;
  const GUARDADO = 'bingo.nombre';

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let codigo = (params.get('p') || '').trim().toUpperCase();
  let nombre = params.get('n') || '';
  try { if (!nombre) nombre = localStorage.getItem(GUARDADO) || ''; } catch (e) { /* sin almacenamiento */ }
  let reloj = null;
  let ultimaPintada = 0;

  $('codigo').value = codigo;
  $('nombre').value = nombre;

  function avisar(texto, malo) {
    $('aviso').innerHTML = texto || '';
    $('aviso').hidden = !texto;
    $('aviso').classList.toggle('malo', Boolean(malo));
  }

  function escapar(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  function mostrarFormulario() {
    clearInterval(reloj);
    reloj = null;
    $('entrar').hidden = false;
    $('juego').hidden = true;
  }

  async function mirar() {
    let r;
    try {
      const res = await fetch('/api/bingo/carton?p=' + encodeURIComponent(codigo) + '&nombre=' + encodeURIComponent(nombre), { cache: 'no-store' });
      if (res.status === 404) {
        avisar('No hay ninguna partida con el código <b>' + escapar(codigo) + '</b>. Puede que ya haya terminado, o que esté mal escrito.', true);
        mostrarFormulario();
        return;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      r = await res.json();
    } catch (e) {
      avisar('Sin conexión. Reintentando…', true);
      return;
    }
    pintar(r);
  }

  function pintar(r) {
    $('entrar').hidden = true;
    $('juego').hidden = false;
    $('quien').textContent = nombre;

    const ultima = r.salidas[r.salidas.length - 1] || 0;
    BingoDibujo.bola($('bola'), ultima, ultima && ultima !== ultimaPintada);
    ultimaPintada = ultima;

    if (!r.jugador) {
      $('carton').innerHTML = '';
      $('cantar').hidden = true;
      $('fase').textContent = '';
      avisar(r.abierta
        ? '<b>' + escapar(nombre) + '</b> aún no tiene cartón. Escribe <b>' + escapar(r.palabra) + '</b> en el chat y aparecerá aquí.'
        : '<b>' + escapar(nombre) + '</b> no tiene cartón en esta partida, y ya no se pueden pedir. ¿Está bien escrito el nombre?', !r.abierta);
      return;
    }

    BingoDibujo.carton($('carton'), r.jugador.carton, r.salidas, { fuera: r.jugador.descalificado });

    $('fase').innerHTML = r.fase === 'fin'
      ? 'Partida terminada'
      : !r.salidas.length
        ? 'Esperando la primera bola…'
        : 'Bola ' + r.salidas.length + ' de 75<br>Se juega ' + (r.fase === 'linea' ? '<b>la línea</b>' : '<b>el cartón lleno</b>');

    // Si lo tiene, se le dice qué escribir. Es lo único que de verdad tiene que
    // hacer, y se le puede pasar mirando el directo.
    const salidas = new Set(r.salidas);
    const marcada = (c, f) => r.jugador.carton[c][f] === BingoDibujo.LIBRE || salidas.has(r.jugador.carton[c][f]);
    let lleno = true;
    for (let c = 0; c < 5; c++) for (let f = 0; f < 5; f++) if (!marcada(c, f)) lleno = false;
    const linea = $('carton').querySelector('.en-linea') !== null;
    const loTiene = r.fase === 'linea' ? linea : r.fase === 'bingo' ? lleno : false;
    const yaGano = r.cantos.some((c) => c.nombre.toLowerCase() === nombre.toLowerCase() && c.que === r.fase);
    $('cantar').hidden = !loTiene || yaGano || r.jugador.descalificado;
    $('cantar').innerHTML = '¡Lo tienes! Escribe <b>' + escapar(r.cantar) + '</b> en el chat, ya';

    avisar(r.jugador.descalificado
      ? 'Cantaste sin tenerlo: estás <b>descalificado</b> en esta partida.'
      : '', r.jugador.descalificado);

    $('ganadores').innerHTML = r.cantos.map((c) => '<li>' + escapar(BingoDibujo.textoCanto(c)) + '</li>').join('');
  }

  $('entrar').addEventListener('submit', (ev) => {
    ev.preventDefault();
    codigo = $('codigo').value.trim().toUpperCase();
    nombre = $('nombre').value.trim().replace(/^@/, '');
    if (!codigo || !nombre) return;
    try { localStorage.setItem(GUARDADO, nombre); } catch (e) { /* da igual */ }
    // Que recargar la página deje en el mismo sitio.
    history.replaceState(null, '', '/bingo?p=' + encodeURIComponent(codigo));
    avisar('');
    empezar();
  });

  $('cambiar').addEventListener('click', () => {
    avisar('');
    mostrarFormulario();
    $('nombre').focus();
  });

  function empezar() {
    clearInterval(reloj);
    ultimaPintada = 0;
    mirar();
    reloj = setInterval(mirar, CADA_MS);
  }

  if (codigo && nombre) empezar();
  else if (codigo) $('nombre').focus();
})();
</script>
</body>
</html>
